# Конфигурация проекта «Типы локальных экономик муниципалитетов: безналичное потребление и рынок труда»
# Все пути — относительно корня репозитория. Гиперпараметры методов — здесь же.

seed: 42

paths:
  raw: "data/raw/hackathon"              # архив конкурса (consumption, connection, market_access)
  external: "data/external"              # справочник МО СберИндекса, муниципальная статистика Росстата
  interim: "data/interim"
  processed: "data/processed"
  reports: "reports"
  figures: "reports/figures"

data:
  consumption: "consumption.parquet"
  connection: "connection.parquet"
  market_access: "market_access.parquet"
  # официальный источник для скрипта скачивания (лицензия CC BY-SA 4.0)
  source_url: "https://www.sberbank.com/common/img/uploaded/files/pdf/sberindex/hackathonlicence.zip"
  source_page: "https://sberindex.ru/ru/research/data-sense-opisanie-nabora-dannikh-khakatona-sberindeksa-po-munitsipalnim-dannim"

reference:
  # Версионный справочник МО СберИндекса (страница «Границы и изменения муниципальных образований»)
  page: "https://sberindex.ru/ru/research/dataset-borders-and-changes-of-municipalities"
  table: "sberindex_dict/t_dict_municipal_districts.xlsx"
  polygons: "sberindex_dict/t_dict_municipal_districts_poly.gpkg"

sample:
  months_required: 24          # базовая выборка: МО с полным рядом (2 016)
  # Варианты с доступностью рынков и автодорогами сравниваются на общей выборке (2 004).

features:
  categories: ["Продовольствие", "Здоровье", "Маркетплейсы", "Общественное питание", "Транспорт"]
  total: "Все категории"
  other_label: "Прочее"
  # Блоки признаков узла: структура (доли 5 категорий + прочее), относительный уровень
  # (лог-разность с медианой МО в том же месяце), динамика (рост, сезонность, волатильность).
  blocks: ["structure", "level", "dynamics"]
  period: "Q"                  # период для динамической сети: Q — квартал

graphs:
  knn: 10                      # число соседей при разрежении графа
  mutual: false                # true — только взаимные соседи
  structure:
    metric: "cosine"           # близость структуры и уровня расходов
  comovement:
    series: "residual"         # относительные траектории: минус медиана по МО в том же месяце (без общего национального компонента)
    min_corr: 0.0
  leadlag:
    max_lag: 3                 # месяцев
    dtw_window: 3              # окно Сакое–Чибы для DTW
  geography:
    type: "highway"            # highway | railway
    knn: 8
    zero_km: 1.0               # нулевые расстояния (общий центр) заменяются на 1 км
    sigma_km: 150.0            # ширина ядра exp(-d/sigma)
  # Мультиплекс — только «реляционные» слои; граф structure строится из тех же признаков,
  # что и блок Y в KEFRiN, и в мультиплексе дал бы двойной учёт признаков.
  multiplex_layers: ["geography", "comovement", "leadlag"]

methods:
  k_range: [4, 5, 6, 7, 8, 9, 10, 11, 12]
  kmeans: {n_init: 20}
  gmm: {covariance_type: "full", n_init: 5}
  ward: {}
  spectral: {assign_labels: "cluster_qr"}
  leiden: {resolutions: [0.02, 0.05, 0.1, 0.2, 0.3, 0.5, 1.0], n_iterations: -1}
  networks: ["geography", "comovement", "leadlag", "multiplex"]   # сети для сетевых методов
  kefrin:
    distance: "cosine"         # euclidean | cosine | manhattan (Shalileh & Mirkin, 2022)
    distances: ["cosine", "euclidean"]   # варианты в сравнении (manhattan — медленный, вне сетки)
    rho_feature: 1.0           # вес блока признаков в критерии
    rho_network: 1.0           # вес блока связей (ξ в статье); в сетке умножается на xi_grid
    xi_grid: [1, 4, 16]        # 1 — как в статье; 4, 16 — усиление сети (разреженный kNN-граф
                               # объясняет малую долю разброса строк, см. отчёт)
    balance_scatter: true      # euclidean: ξ дополнительно умножается на разброс(Y)/разброс(P)
    n_init: 20
    n_init_bootstrap: 5
    max_iter: 100
  pattern:
    tolerance: 0.0             # 0 — точное равенство, как в исходном методе
    indicators: "shares_z"     # z-оценки долей 5 категорий (сопоставимые величины)

evaluation:
  icvi: ["SW", "CH", "S_Dbw", "AVI", "AVU", "MQ"]
  network: "geography"         # сеть для AVI/AVU/MQ в основной спецификации (дана организаторами)
  sensitivity_networks: ["comovement", "leadlag", "multiplex"]
  min_cluster_share: 0.01      # допустимость: каждый кластер ≥ 1% МО (иначе тип не интерпретируем)
  max_cluster_share: 0.6       # и ни один кластер не поглощает больше 60% МО
  bootstrap: 50                # повторов для устойчивости (ARI на подвыборках)
  subsample: 0.8
  stability_min: 0.6           # порог устойчивости итогового разбиения (средний ARI)
  bootstrap_top: 12            # устойчивость считается для лучших по Борда кандидатов
  ranking: ["borda", "copeland"]

dynamics:
  min_run: 2                   # «устойчивый сдвиг»: новый тип держится ≥ 2 кварталов до конца периода
  network_multipliers: [0, 0.5, 1, 2]   # чувствительность квартальных типов к весу сетевого члена

fca:
  max_len: 3                   # не более 3 признаков в описании типа
  min_precision: 0.6           # доля МО типа в объёме понятия
  min_extent: 10
  top: 3

network_choice:
  perms: 199                   # перестановок для p-значений I Морана
  nulls: 20                    # случайных графов в нуль-модели (переключения рёбер, степени сохраняются точно)

# Названия типов итогового разбиения (номер = место по размеру, 0 — самый крупный).
# Даны по профилям и описаниям АФП после выбора разбиения; при смене разбиения их нужно пересмотреть.
# Типы 4 и 6 названы по профилю: ядро — Москва с областью (159 из 164 МО) и Петербург (94 из 99), но в них
# входят и другие МО со сходными расходами (Владивосток, Хабаровск, Петрозаводск и др.).
type_names:
  0: "Сельские районы с низкими расходами"
  1: "Средний уровень, ровный сезон"
  2: "Растущие города"
  3: "Удалённые районы с сезонными пиками"
  4: "Московский профиль расходов"
  5: "Северные ресурсные территории"
  6: "Петербургский профиль расходов"
  7: "Крайний Север с летним пиком"

labor:
  file: "bdmo/bdmo_2021_2024.parquet"   # выборка из «Муниципальной статистики России» (tochno.st/datasets/bdmo)
  source_version: "БД ПМО Росстата в обработке «Если быть точным», описание набора v20250918"
  years: [2023, 2024]                   # то же окно, что у расходов
  migration_years: [2022, 2023]         # за 2024 г. миграции нет
  bootstrap: 30                         # подвыборок для устойчивости типологии труда
  bootstrap_top: 6
  lisa_perms: 9999                      # перестановок на seed (ошибка Монте-Карло при 499 меняла десятки меток)
  lisa_seeds: 5                         # seed; перестановки объединяются, устойчивость меток — по seed

# Названия типов рынка труда (k-means, K = 6; номер = место по размеру).
labor_type_names:
  0: "Стареющая периферия"
  1: "Промышленные города"
  2: "Аграрные районы"
  3: "Спальные районы мегаполисов"
  4: "Добывающий Север"
  5: "Деловые районы мегаполисов"

stability:
  finalist_k: [6, 7, 8]        # финалисты — лучшие варианты итогового семейства при этих K
  bootstrap: 50
  init_runs: 10                # запусков на полных данных с другими seed (устойчивость оптимизации)

extra_checks:                  # src/extra_checks.py: перенос на новые регионы, 6 против 8 типов, подбор аналогов
  folds: 5                     # регионы делятся на 5 частей; каждая по очереди — отложенная
  repeats: 3                   # три разных случайных деления регионов
  k_values: [6, 7, 8]          # итоговое семейство (KEFRiN, мультиплекс) при этих K
  n_analogs: 7                 # аналогов на МО, как на странице

publication:
  repo_url: "https://github.com/shko2991/sberindex-local-economies"   # пусто — на GitHub Pages определяется по адресу страницы
  results_version: "2026-10-09"   # версия результатов, показывается на странице
